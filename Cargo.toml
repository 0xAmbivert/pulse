[package]
name = "pulse"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
alloy = { version = "2.5.0", features = ["full"] }

# Cryptography & Security
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
libc = "0.2"
hex = "0.4"

# Terminal UI & Async utilities
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
futures-util = "0.3"

# CLI, Config & Serialization
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# HTTP, Relays & Logging
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
chrono = "0.4"
rpassword = "7.5.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
